services:
  postgres:
    image: postgres:16
    container_name: proof-of-charge-postgres
    environment:
      POSTGRES_DB: proof_of_charge
      POSTGRES_USER: proof
      POSTGRES_PASSWORD: proof
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof -d proof_of_charge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
